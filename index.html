<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Speed Monitor"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Speed Monitor</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#000000;color:#f5f5f5;--accent:#f5f5f5;--wash:#101010;--muted:#b0b0b0}*{box-sizing:border-box}body{margin:0;padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));min-height:100svh}body[data-state=good]{--accent:#44ff91;--wash:#0b1b12}body[data-state=over]{--accent:#ff4f61;--wash:#220a0e}main{max-width:480px;min-height:calc(100svh - 54px);margin:auto;display:flex;flex-direction:column;gap:16px}header{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:750;letter-spacing:-.02em}#gps{font-size:11px;letter-spacing:.04em;color:var(--muted);font-weight:650}#gps::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:#9ba5a0}#gps.live::before{background:#44ff91}.meter{flex:1;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid #252525;border-radius:32px;background:var(--wash);color:var(--accent);padding:24px 12px;transition:background .2s,color .2s}.eyebrow{font-size:12px;letter-spacing:.09em;font-weight:650;text-transform:uppercase}.meter .eyebrow{opacity:.85}#speed{font-size:clamp(88px,32vw,158px);font-weight:760;letter-spacing:-.085em;line-height:1.02;font-variant-numeric:tabular-nums;padding-right:.07em}#status{font-size:20px;font-weight:720;margin-top:20px;letter-spacing:-.035em}.road-panel{display:flex;align-items:center;gap:16px;padding:16px 18px;background:#101010;border:1px solid #262626;border-radius:24px}.sign{width:78px;height:88px;flex:none;background:#fff;color:#19221d;border:2px solid #19221d;border-radius:9px;display:grid;place-content:center;text-align:center;font-weight:800}.sign small{font-size:10px;line-height:1.05;letter-spacing:.03em}.sign strong{font-size:35px;line-height:1.12;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.road-panel p{margin:5px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}#road{font-size:18px;font-weight:700;letter-spacing:-.025em;overflow-wrap:anywhere}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{font:inherit;font-size:14px;font-weight:680;color:#f5f5f5;background:#151515;border:1px solid #303030;border-radius:16px;padding:13px;min-height:48px;cursor:pointer}button:focus-visible{outline:3px solid #44ff91;outline-offset:3px}button:disabled{opacity:.45}#start{grid-column:1/-1;background:#f5f5f5;color:#000;border:0;font-size:17px;min-height:56px}#demoControls{display:none;grid-column:1/-1;grid-template-columns:1fr 1fr;gap:8px}#demoControls.visible{display:grid}.footer{font-size:11px;color:var(--muted);line-height:1.45;text-align:center}.footer a{color:inherit}#system{margin-bottom:5px} @media(orientation:landscape) and (max-height:560px){main{display:grid;grid-template-columns:1fr 1fr;gap:9px;min-height:0;max-width:850px}header{grid-column:1/-1}.meter{grid-row:2/4;min-height:0;padding:12px}.road-panel{padding:10px}.controls{gap:5px}button,#start{padding:8px;min-height:35px}.footer{grid-column:1/-1}#speed{font-size:92px}#status{margin-top:5px}}
</style></head><body data-state="unknown"><main><header><span>Speed Monitor</span><span id="gps">GPS OFF</span></header><section class="meter"><div class="eyebrow">CURRENT SPEED</div><div id="speed">—</div><div class="eyebrow">MPH</div><div id="status" role="status" aria-live="polite">Ready to drive</div></section><section class="road-panel"><div class="sign" aria-label="Mapped speed limit"><small>SPEED<br>LIMIT</small><strong id="limit">—</strong></div><div><div class="eyebrow">CURRENT ROAD</div><div id="road">Waiting for GPS</div><p id="detail">Mapped limit will appear here.</p></div></section><section class="controls"><button id="start">Start drive</button><button id="sound">Test sound</button><button id="demo">Demo</button><div id="demoControls"><button id="slow">− 5 MPH</button><button id="fast">+ 5 MPH</button></div></section><footer class="footer"><div id="system">Start and test sound before driving. Keep the app visible.</div><div>Road data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> · Posted signs take priority.</div></footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id), MPH=2.236936292, R=6371000;
const CFG={half:850, edge:330, minRequestMs:20000, maxRequests:150, maxBytes:12000000, staleMs:12000, maxAccuracy:35};
let mode='idle', watch=null, audio=null, wake=null, pos=null, speed=null, lastFix=0, road=null, tiles=[], pending=false, lastRequest=0, requestError='', failures=0, retryAt=0, endpointIndex=0, lastMapInfo='', headingAnchor=null, requestController=null, session=0, alerted=false, belowSince=0, demoSpeed=35, dayQuota=null;
const rad=x=>x*Math.PI/180;
function distance(a,b){const p=rad(b.lat-a.lat),q=rad(b.lon-a.lon);const h=Math.sin(p/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(q/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));}
function delta(a,b){return Math.abs(((a-b+540)%360)-180);}
function direction(a,b){const p=rad(a.lat),q=rad(b.lat),l=rad(b.lon-a.lon);return (Math.atan2(Math.sin(l)*Math.cos(q),Math.cos(p)*Math.sin(q)-Math.sin(p)*Math.cos(q)*Math.cos(l))*180/Math.PI+360)%360;}
function parseLimit(v){if(typeof v!=='string')return null;const m=v.trim().match(/^(\d+(?:\.\d+)?)\s*(mph|km\/h|kph)?$/i);if(!m)return null;const n=Number(m[1])*(m[2]?.toLowerCase()==='mph'?1:MPH/3.6);return n>0&&n<=110?Math.round(n*10)/10:null;}
function limitFor(tags,forward){const key=forward?'forward':'backward';if(['no','private'].includes(tags.motor_vehicle??tags.vehicle??tags.access))return null;if(tags['maxspeed:conditional']||tags['maxspeed:'+key+':conditional']||tags['maxspeed:variable']||tags['maxspeed:lanes']||tags['maxspeed:lanes:'+key]||tags['maxspeed:'+key+':lanes']||tags['maxspeed:school']||tags['maxspeed:school_zone'])return null;return parseLimit(tags['maxspeed:'+key]??tags.maxspeed);}
function candidate(p,w){let best=null;const g=w.geometry||[], t=w.tags||{};const lonScale=R*Math.cos(rad(p.lat))*Math.PI/180, latScale=R*Math.PI/180;
for(let i=1;i<g.length;i++){const a=g[i-1],b=g[i];if(!a||!b||!Number.isFinite(a.lat)||!Number.isFinite(a.lon)||!Number.isFinite(b.lat)||!Number.isFinite(b.lon))continue;const ax=(a.lon-p.lon)*lonScale,ay=(a.lat-p.lat)*latScale,bx=(b.lon-p.lon)*lonScale,by=(b.lat-p.lat)*latScale,dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;if(l<.1)continue;const z=Math.max(0,Math.min(1,-(ax*dx+ay*dy)/l)),d=Math.hypot(ax+z*dx,ay+z*dy);if(d>Math.min(32,Math.max(15,p.accuracy+8)))continue;const h=(Math.atan2(dx,dy)*180/Math.PI+360)%360;const onlyF=['yes','1','true'].includes(t.oneway)||(!t.oneway&&(['motorway'].includes(t.highway)||t.junction==='roundabout')),onlyB=t.oneway==='-1';let f=onlyF?true:onlyB?false:null;let diff=0;if(Number.isFinite(p.heading)){const df=onlyB?Infinity:delta(p.heading,h),db=onlyF?Infinity:delta(p.heading,(h+180)%360);f=df<=db;diff=Math.min(df,db);if(diff>65)continue;}const limit=f===null?(limitFor(t,true)===limitFor(t,false)?limitFor(t,true):null):limitFor(t,f);const score=d+diff*.48+(['service','track'].includes(t.highway)&&p.moving?12:0);if(!best||score<best.score)best={id:w.id,score,d,limit,name:t.name||t.ref||'Unnamed road'};}return best;}
function matchRoad(p,ways){const candidates=[];for(const w of ways){const c=candidate(p,w);if(c)candidates.push(c);}candidates.sort((a,b)=>a.score-b.score);if(!candidates.length)return null;const first=candidates[0],ambiguous=candidates.slice(1).some(c=>c.score-first.score<Math.max(5,Math.min(12,p.accuracy*.4))&&c.limit!==first.limit);return {...first,limit:ambiguous?null:first.limit,ambiguous};}
function loadQuota(){const day=new Date().toISOString().slice(0,10);try{const q=JSON.parse(localStorage.getItem('speed-monitor-quota')||'null');if(q?.day===day&&Number.isFinite(q.count)&&Number.isFinite(q.bytes))return q;}catch{}return {day,count:0,bytes:0};}
function saveQuota(){try{localStorage.setItem('speed-monitor-quota',JSON.stringify(dayQuota));}catch{}}

const ENDPOINTS=['https://overpass.private.coffee/api/interpreter','https://overpass-api.de/api/interpreter'];
function boundsFor(p){
  const lat=Number(p.lat.toFixed(4)),lon=Number(p.lon.toFixed(4)),dy=CFG.half/111195,dx=dy/Math.max(.15,Math.cos(rad(lat)));
  return [lat-dy,lon-dx,lat+dy,lon+dx].map(n=>Number(n.toFixed(5)));
}
function margin(p,t){const [a,b,c,d]=t.bounds,scale=111195*Math.cos(rad(p.lat));return Math.min((p.lat-a)*111195,(c-p.lat)*111195,(p.lon-b)*scale,(d-p.lon)*scale);}
function tileFor(p){return tiles.filter(t=>Date.now()-t.time<45*60*1000&&margin(p,t)>35).sort((a,b)=>margin(p,b)-margin(p,a))[0];}
function mapQuery(bounds){const bbox=bounds.join(',');return `[out:json][timeout:8];way[highway~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|road|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link|track)$"](${bbox});out geom(${bbox});`;}
async function loadRoads(p){
  if(mode!=='live'||document.hidden||p.accuracy>100)return;
  const here=tileFor(p);if(here&&margin(p,here)>CFG.edge)return;
  if(pending||Date.now()<retryAt||(!failures&&Date.now()-lastRequest<CFG.minRequestMs))return;
  const today=new Date().toISOString().slice(0,10);if(!dayQuota||dayQuota.day!==today)dayQuota=loadQuota();
  if(dayQuota.count>=CFG.maxRequests||dayQuota.bytes>=CFG.maxBytes){requestError='Daily map budget reached';return;}
  pending=true;lastRequest=Date.now();requestError='';dayQuota.count++;saveQuota();
  const id=session,ctrl=new AbortController();requestController=ctrl;const timeout=setTimeout(()=>ctrl.abort(),10000),bounds=boundsFor(p),q=mapQuery(bounds);
  try{
    const response=await fetch(ENDPOINTS[endpointIndex]+'?'+new URLSearchParams({data:q}),{signal:ctrl.signal,cache:'no-store'});
    if(!response.ok){const err=Error('HTTP '+response.status);err.status=response.status;throw err;}
    const raw=await response.text();dayQuota.bytes+=new TextEncoder().encode(raw).length;saveQuota();
    const data=JSON.parse(raw);if(data.remark||!Array.isArray(data.elements))throw Error('Incomplete map response');if(id!==session)return;
    const ways=data.elements.filter(w=>w.type==='way'&&w.geometry?.length>1);
    const tagged=ways.filter(w=>w.tags&&Object.keys(w.tags).some(k=>k==='maxspeed'||k==='maxspeed:forward'||k==='maxspeed:backward')).length;
    tiles.unshift({lat:p.lat,lon:p.lon,bounds,time:Date.now(),ways,tagged});tiles=tiles.slice(0,10);
    lastMapInfo=ways.length+' roads · '+tagged+' with mapped limits';failures=0;retryAt=0;
  }catch(e){
    if(id===session){failures++;endpointIndex=(endpointIndex+1)%ENDPOINTS.length;const rate=[429,406,403].includes(e.status);retryAt=Date.now()+(rate?60000:Math.min(120000,5000*2**Math.min(failures-1,5)));requestError=e.status?'Map server HTTP '+e.status+' · retry scheduled':e.name==='AbortError'?'Map lookup timed out · retry scheduled':'Map connection failed · retry scheduled';}
  }finally{clearTimeout(timeout);if(id===session){pending=false;requestController=null;update();}}
}
async function enableAudio(){try{if(!audio||audio.state==='closed')audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state!=='running')await audio.resume();return audio.state==='running';}catch{return false;}}
function beep(){if(!audio||audio.state!=='running')return false;try{const t=audio.currentTime;for(let i=0;i<3;i++){const o=audio.createOscillator(),g=audio.createGain(),s=t+i*.22;o.type='sine';o.frequency.value=i===1?660:880;g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(.38,s+.025);g.gain.exponentialRampToValueAtTime(.001,s+.16);o.connect(g);g.connect(audio.destination);o.start(s);o.stop(s+.17);}return true;}catch{return false;}}
async function lockScreen(){if(mode!=='live'||document.hidden||!navigator.wakeLock||wake&&!wake.released)return;try{const lock=await navigator.wakeLock.request('screen');if(mode!=='live'||document.hidden){await lock.release();return;}wake=lock;lock.addEventListener('release',()=>{if(wake===lock)wake=null;});}catch{}}
function clearReading(){headingAnchor=null;pos=null;speed=null;road=null;lastFix=0;alerted=false;belowSince=0;}
function render(s,limit,name,detail,state,status,gps,sys){document.body.dataset.state=state;$('speed').textContent=s===null?'—':String(Math.round(s));$('limit').textContent=limit===null?'—':Number.isInteger(limit)?String(limit):limit.toFixed(1);$('road').textContent=name;$('detail').textContent=detail;$('status').textContent=status;$('gps').textContent=gps;$('gps').classList.toggle('live',gps==='GPS LIVE');$('system').textContent=sys;}
function showReading(s,r,gps,sys){const limit=r?.limit??null;let state='unknown',status=pending&&!r?'Finding limit':'Limit unknown';if(s===null)status='Speed unavailable';else if(limit!==null){if(s>limit){state='over';status='Slow down';belowSince=0;if(!alerted&&beep())alerted=true;}else{state='good';status='Within limit';if(!belowSince)belowSince=Date.now();if(Date.now()-belowSince>=2000)alerted=false;}}else{belowSince=0;alerted=false;}render(s,limit,r?.ambiguous?'Road match uncertain':r?.name||(pending?'Finding your road':requestError?'Map unavailable':'Road not confirmed'),r?.ambiguous?'Nearby roads have conflicting limits.':limit!==null?'Mapped speed limit':r?'Road found; speed limit not mapped or conditional.':pending?'Downloading nearby roads…':requestError||(lastMapInfo?'No road matched to GPS. '+lastMapInfo:'Waiting for map data.'),state,status,gps,sys);}
function update(){if(mode!=='live'||document.hidden)return;const now=Date.now();const sys=(audio?.state==='running'?'Sound ready':'Sound not ready · tap Test sound when parked')+' · '+(wake&&!wake.released?'Screen awake':'Keep screen awake manually');if(!pos||now-lastFix>CFG.staleMs){clearReading();render(null,null,'Waiting for GPS','No fresh GPS fix.','unknown','GPS unavailable','GPS WAITING',sys);return;}if(pos.accuracy>CFG.maxAccuracy){road=null;render(null,null,'Location uncertain','GPS accuracy ±'+Math.round(pos.accuracy)+' m. Enable Precise Location.','unknown','Weak GPS signal','GPS WAITING',sys);return;}loadRoads(pos);const tile=tileFor(pos);lastMapInfo=tile?tile.ways.length+' roads · '+tile.tagged+' with mapped limits':'';road=tile?matchRoad(pos,tile.ways):null;showReading(speed,road,'GPS LIVE',sys+(tile?' · '+lastMapInfo:''));}
function onPosition(fix){if(mode!=='live'||document.hidden)return;const c=fix.coords,now=Date.now();if(!Number.isFinite(fix.timestamp)||now-fix.timestamp>CFG.staleMs||fix.timestamp<=lastFix)return;const p={lat:c.latitude,lon:c.longitude,accuracy:c.accuracy,heading:null,moving:Number.isFinite(c.speed)&&c.speed>6.7};if(!Number.isFinite(p.lat)||!Number.isFinite(p.lon)||!Number.isFinite(p.accuracy)||p.accuracy<0)return;const validSpeed=Number.isFinite(c.speed)&&c.speed>=0;speed=validSpeed&&p.accuracy<=CFG.maxAccuracy?Math.round(c.speed*MPH*10)/10:null;if(speed!==null&&speed>=5&&Number.isFinite(c.heading)&&c.heading>=0&&c.heading<360)p.heading=c.heading;else if(speed!==null&&speed>=5&&headingAnchor&&now-headingAnchor.time<=15000&&distance(headingAnchor,p)>Math.max(18,headingAnchor.accuracy+p.accuracy)){p.heading=direction(headingAnchor,p);headingAnchor={...p,time:now};}else if(speed!==null&&speed>=5&&pos&&Number.isFinite(pos.heading)&&now-lastFix<4000)p.heading=pos.heading;if(!headingAnchor||now-headingAnchor.time>15000||speed===null||speed<5)headingAnchor={...p,time:now};pos=p;lastFix=fix.timestamp;if(p.accuracy<=100)loadRoads(p);update();}
function watchGPS(){if(watch!==null)navigator.geolocation.clearWatch(watch);watch=navigator.geolocation.watchPosition(onPosition,e=>{if(mode!=='live')return;clearReading();render(null,null,'Location unavailable',e.code===1?'Allow Safari location and Precise Location.':'Waiting for a reliable GPS fix.','unknown','GPS unavailable','GPS WAITING','Keep the app open. Check permissions when parked.');},{enableHighAccuracy:true,maximumAge:0,timeout:12000});}
function setButtons(){ $('start').textContent=mode==='live'?'End drive':'Start drive';$('demo').textContent=mode==='demo'?'Exit demo':'Demo';$('demoControls').classList.toggle('visible',mode==='demo');$('demo').disabled=mode==='live';}
function stop(){session++;mode='idle';if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null;}requestController?.abort();requestController=null;pending=false;if(wake){wake.release().catch(()=>{});wake=null;}clearReading();setButtons();render(null,null,'Waiting for GPS','Mapped limit will appear here.','unknown','Ready to drive','GPS OFF','Start and test sound before driving. Keep the app visible.');}
async function start(){if(mode==='live'){stop();return;}if(mode==='demo')stop();if(!window.isSecureContext||!navigator.geolocation){render(null,null,'HTTPS required','Open the hosted app in Safari.','unknown','GPS unavailable','GPS OFF','A local file preview cannot reliably access GPS.');return;}mode='live';session++;clearReading();setButtons();const promise=enableAudio();lockScreen();watchGPS();update();await promise;update();}
function demo(){if(mode==='demo'){stop();return;}if(mode==='live')return;mode='demo';demoSpeed=35;alerted=false;belowSince=0;setButtons();enableAudio().then(drawDemo);drawDemo();}
function drawDemo(){if(mode!=='demo')return;showReading(demoSpeed,{limit:35,name:'Example Road'},'DEMO','Simulation only · no GPS or network requests.');}
$('start').onclick=start;$('sound').onclick=async()=>{const ok=await enableAudio();if(ok)beep();$('system').textContent=ok?'Warning played. Confirm you can hear it before driving.':'Audio unavailable. Check volume and sound settings.';};$('demo').onclick=demo;$('slow').onclick=()=>{demoSpeed=Math.max(0,demoSpeed-5);drawDemo();};$('fast').onclick=()=>{demoSpeed=Math.min(120,demoSpeed+5);drawDemo();};
setInterval(()=>{if(mode==='live'){update();if(!wake&& !document.hidden)lockScreen();}else if(mode==='demo')drawDemo();},1000);
document.addEventListener('visibilitychange',()=>{if(mode!=='live')return;clearReading();if(document.hidden){if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null;}}else{lockScreen();watchGPS();update();}});
window.addEventListener('pagehide',()=>{if(mode==='live')stop();});
if('serviceWorker'in navigator&&window.isSecureContext&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
